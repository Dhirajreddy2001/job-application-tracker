# Application Name
spring.application.name=JAT

# --------------------------------------------
# ✅ Oracle DB (running in Docker as "oracle-ee")
# --------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@oracle-ee:1521/ORCLPDB1
spring.datasource.username=SYSTEM
spring.datasource.password=Oracle123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --------------------------------------------
# ✅ Redis (running in Docker as "redis-jat")
# --------------------------------------------
spring.redis.host=redis-jat
spring.redis.port=6379

# --------------------------------------------
# ✅ JPA / Hibernate Settings
# --------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --------------------------------------------
# ✅ Server Port
# --------------------------------------------
server.port=8080

# --------------------------------------------
# ✅ (Optional) Session Management using Redis
# --------------------------------------------
spring.session.store-type=redis

logging.level.org.springframework.boot.context=DEBUG
